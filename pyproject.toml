[project]
name = "jb-gateway-mcp"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Jithesh Bharathan", email = "jithesh@jithonline.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "google-auth-oauthlib>=1.4.0",
    "keyring>=25.7.0",
    "mcp>=2.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
jb-gateway-mcp = "jb_gateway_mcp.server:main"
onboard-google = "jb_gateway_mcp.cli.onboard_google:main"
uninstall-google = "jb_gateway_mcp.cli.uninstall:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
