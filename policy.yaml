# jb_gateway_mcp policy file — deny-by-default.
#
# This file currently grants nothing, which is a valid and safe starting
# state — every caller/tool combination is denied until an entry is added
# below. Authorization is an operational decision for whoever deploys this
# server; live grants are not hardcoded here.
#
# Registered tools (see src/jb_gateway_mcp/adapters/):
#   gmail.list_messages           (scope: gmail.readonly)
#   gmail.read_message             (scope: gmail.readonly)
#   gmail.send_message             (scope: gmail.send)
#   calendar.list_events           (scope: calendar.readonly)
#   calendar.create_event          (scope: calendar.events)
#   drive.list_files               (scope: drive.readonly)
#   drive.read_file                (scope: drive.readonly)
#   bank.list_accounts             (scope: bank.readonly)
#   bank.get_balance                (scope: bank.readonly)
#   bank.summarize_spending         (scope: bank.readonly)
#   bank.list_transactions_summary  (scope: bank.readonly)
#   bank.list_transactions_detailed (scope: bank.transactions.detailed — adds
#     counterparty name/description; IBANs stay masked either way)
#
# Shape (from DESIGN.md section 7):
#
# callers:
#   agent-x:
#     allow:
#       - tool: gmail.list_messages
#         scope: gmail.readonly
#       - tool: calendar.list_events
#         scope: calendar.readonly
#   agent-y:
#     allow:
#       - tool: gmail.send_message
#         scope: gmail.send

callers:
  local:
    allow:
      - tool: gmail.list_messages
        scope: gmail.readonly
      - tool: gmail.read_message
        scope: gmail.readonly
      - tool: calendar.list_events
        scope: calendar.readonly
      - tool: drive.list_files
        scope: drive.readonly
      - tool: drive.read_file
        scope: drive.readonly
      - tool: bank.list_accounts
        scope: bank.readonly
      - tool: bank.get_balance
        scope: bank.readonly
      - tool: bank.summarize_spending
        scope: bank.readonly
      - tool: bank.list_transactions_summary
        scope: bank.readonly
      # Only add these if you actually want an agent to be able to send
      # mail / create events on your behalf:
      - tool: gmail.send_message
        scope: gmail.send
      - tool: calendar.create_event
        scope: calendar.events
      # Adds counterparty name + payment description to transaction results
      # (IBANs stay masked either way). Off by default — only add this if
      # you deliberately want that level of detail reachable by an agent:
      - tool: bank.list_transactions_detailed
        scope: bank.transactions.detailed